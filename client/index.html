<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KSP DAPPA — Karnataka Police Intelligence</title>
    <meta name="description" content="KSP DAPPA — Data Analytics & Predictive Policing Assistant for Karnataka State Police. Crime dashboards, geo-intelligence, forecasting and case analytics on synthetic demonstration data. KSP Datathon 2026 prototype." />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1220" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5FA" />
    <meta property="og:title" content="KSP DAPPA — Karnataka Police Intelligence" />
    <meta property="og:description" content="Crime dashboards, geo-intelligence, forecasting and case analytics for Karnataka State Police. Synthetic demonstration data — KSP Datathon 2026 prototype." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KSP DAPPA" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Pre-paint theme + density + motion so there is no flash of the wrong
      // scheme. Dark is the product default; 'light' only when explicitly
      // persisted; 'system' follows prefers-color-scheme.
      (function () {
        var theme = 'dark';
        try {
          var t = localStorage.getItem('dappa-theme');
          if (t === 'light' || t === 'dark') theme = t;
          else if (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
          if (localStorage.getItem('dappa-density') === 'compact') {
            document.documentElement.dataset.density = 'compact';
          }
          if (localStorage.getItem('dappa-motion') === 'reduce') {
            document.documentElement.dataset.motion = 'reduce';
          }
        } catch (e) { /* storage unavailable — keep dark */ }
        var root = document.documentElement;
        root.classList.remove('dark', 'light');
        root.classList.add(theme);
        root.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
