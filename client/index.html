<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1220" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5FA" />
    <meta property="og:title" content="KSP DAPPA — Karnataka Police Intelligence" />
    <meta property="og:description" content="Crime dashboards, geo-intelligence, forecasting and case analytics for Karnataka State Police. Synthetic demonstration data — KSP Datathon 2026 prototype." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KSP DAPPA" />
    <!-- absolute URLs required by link scrapers; the image ships in public/media
         so the Pages deployment serves it itself -->
    <meta property="og:url" content="https://golden007-prog.github.io/KSP-Dappa/" />
    <meta property="og:image" content="https://golden007-prog.github.io/KSP-Dappa/media/command-dashboard.jpg" />
    <meta property="og:image:width" content="1476" />
    <meta property="og:image:height" content="812" />
    <meta property="og:image:alt" content="KSP DAPPA command dashboard — crime analytics for Karnataka State Police" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KSP DAPPA — Karnataka Police Intelligence" />
    <meta name="twitter:description" content="Crime dashboards, geo-intelligence, forecasting and case analytics. Synthetic data — KSP Datathon 2026 prototype." />
    <meta name="twitter:image" content="https://golden007-prog.github.io/KSP-Dappa/media/command-dashboard.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Pre-paint theme + density + motion so there is no flash of the wrong
      // scheme. Dark is the product default; 'light' only when explicitly
      // persisted; 'system' follows prefers-color-scheme.
      (function () {
        var theme = 'dark';
        try {
          var t = localStorage.getItem('dappa-theme');
          if (t === 'light' || t === 'dark') theme = t;
          else if (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
          if (localStorage.getItem('dappa-density') === 'compact') {
            document.documentElement.dataset.density = 'compact';
          }
          if (localStorage.getItem('dappa-motion') === 'reduce') {
            document.documentElement.dataset.motion = 'reduce';
          }
        } catch (e) { /* storage unavailable — keep dark */ }
        var root = document.documentElement;
        root.classList.remove('dark', 'light');
        root.classList.add(theme);
        root.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <noscript>
      <!-- the app stylesheet ships with the JS bundle, so this block styles itself -->
      <div style="max-width:32rem;margin:15vh auto 0;padding:1.5rem;font-family:system-ui,sans-serif;text-align:center;color:#8A94A8;background:#111A2C;border:1px solid #1E2A44;border-radius:12px">
        <p style="font-size:1.05rem;font-weight:600;color:#E6EAF2;margin:0 0 .5rem">KSP DAPPA needs JavaScript</p>
        <p style="font-size:.85rem;line-height:1.5;margin:0">
          This is an interactive crime-analytics command center — maps, charts and live filters
          cannot render without scripting. Please enable JavaScript and reload.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
